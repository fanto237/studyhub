<section
  id="sidebar-profile"
  class="scroll-mt-6 rounded-4xl border border-base-300 bg-base-200/70 p-4 outline-none focus-visible:ring-2 focus-visible:ring-primary/60"
  [attr.aria-labelledby]="!loading() && user() ? 'sidebar-profile-heading' : null"
  [attr.aria-label]="!loading() && user() ? null : 'Profile'"
  tabindex="-1"
>
  @if (loading()) {
  <div class="flex items-center gap-3">
    <div class="skeleton size-12 rounded-2xl"></div>
    <div class="min-w-0 flex-1 space-y-2">
      <div class="skeleton h-4 w-32 rounded-full"></div>
      <div class="skeleton h-3 w-24 rounded-full"></div>
      <div class="skeleton h-6 w-24 rounded-full"></div>
    </div>
  </div>
  } @else { @if (user(); as currentUser) {
  <div class="flex min-w-0 items-center gap-3">
    <span
      class="flex size-12 shrink-0 items-center justify-center rounded-2xl bg-primary text-sm font-black text-primary-content shadow-lg shadow-primary/20"
    >
      {{ initials(currentUser) }}
    </span>
    <div class="min-w-0 flex-1">
      <h2 id="sidebar-profile-heading" class="truncate text-base font-black">
        {{ currentUser.fullName }}
      </h2>
      <p class="truncate text-xs font-semibold text-base-content/55">
        @{{ currentUser.username }}
      </p>
      <p
        class="mt-2 inline-flex items-center gap-1.5 rounded-full bg-primary/10 px-2.5 py-1 text-[0.7rem] font-black text-primary"
      >
        <span>{{ currentUser.karmaScore | number }}</span>
        <span class="uppercase tracking-wide opacity-80">karma</span>
      </p>
    </div>
  </div>
  } }
</section>
