<header class="border-b border-base-300 px-0 py-4">
  <div class="flex flex-wrap items-center gap-3">
    <div class="flex min-w-0 flex-1 items-center">
      <a
        class="flex items-center gap-2 text-base-content"
        [routerLink]="homeLink()"
        [attr.aria-label]="'navigation.aria.home' | translate"
      >
        <app-icon name="studyhub-file" class="size-6 shrink-0 text-primary" />
        <span class="text-xl font-bold tracking-tight sm:text-2xl"
          >StudyHub</span
        >
      </a>
    </div>

    <nav
      class="order-4 hidden w-full flex-wrap justify-center gap-2 lg:order-0 lg:flex lg:w-auto lg:flex-1"
      [attr.aria-label]="'navigation.aria.primary' | translate"
    >
      <ng-content select="[siteHeaderNav]" />
    </nav>

    <div class="flex shrink-0 items-center gap-2">
      <app-language-selector />
      <app-theme-toggle />
    </div>

    <div
      class="order-3 flex w-full flex-wrap items-center justify-end gap-2 sm:order-0 sm:w-auto sm:shrink-0"
    >
      <ng-content select="[siteHeaderActions]" />
    </div>
  </div>
</header>
